openapi: 3.2.0
info:
  title: Hmcts Internal API
  version: 1.0.0
  contact:
    name: HMCTS API Marketplace
    email: no-reply@hmcts.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: 'Operations tagged Internal across 2 of this provider''s published API definitions: api-cp-crime-hearing-results-document-subscription-openapi-spec.yml, hmcts-crime-hearing-results-document-subscription-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Crime Hearing Results Document Subscription API
  url: https://api-cp-crime-hearing-results-document-subscription.net/{version}
  variables:
    version:
      default: 1.0.0
      description: API version; matches the spec info.version
security:
- bearerAuth: []
  subscriptionKey: []
tags:
- name: Internal
paths:
  /notifications:
    post:
      summary: Create a client notification
      description: Creates a client notification for given material id and event type
      operationId: createNotification
      tags:
      - Internal
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPayload'
            examples:
              PCR:
                $ref: '#/components/examples/PCR'
              NowsCustodialSentence:
                $ref: '#/components/examples/NowsCustodialSentence'
      responses:
        '202':
          description: accepted
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          description: Unauthorized - missing or invalid authentication credentials
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '403':
          description: Forbidden - valid subscription key required but not subscribed to this API
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
    servers:
    - description: Crime Hearing Results Document Subscription API
      url: https://api-cp-crime-hearing-results-document-subscription.net/{version}
      variables:
        version:
          default: 1.0.0
          description: API version; matches the spec info.version
