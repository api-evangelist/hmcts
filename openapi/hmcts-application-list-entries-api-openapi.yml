          $ref: '#/components/schemas/applicant'
        respondent:
          $ref: '#/components/schemas/respondent'
        applicationTitle:
          description: Descriptive title of the application.
          example: Application to Crown Court
          type: string
        legislation:
          description: Legislation under which the application is made.
          example: Application to Crown Court
          type: string
        isFeeRequired:
          description: True if submitting the application incurs a charge.
          type: boolean
        isResulted:
          description: True if this application list entry has been resulted.
          type: boolean
        listId:
          description: Unique Identifier of the Application List to which this entry belongs.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          format: uuid
          type: string
        date:
          description: Single date of the Application List.
          example: 2025-10-07
          format: date
          type: string
        sequenceNumber:
          description: The sequence number of the application in the list.
          example: 1
          type: integer
        resulted:
          description: List of result codes applied to this application list entry.
          items:
            $ref: '#/components/schemas/result-code-get-summary-dto'
          type: array
        status:
          $ref: '#/components/schemas/application-list-status'
        accountNumber:
          example: ACC-001
          maxLength: 20
          type:
          - string
          - 'null'
      required:
      - applicantName
      - applicationTitle
      - id
      - isFeeRequired
      - isResulted
      - status
      type: object
    job-acknowledgement:
      additionalProperties: false
      description: Acknowledgement returned when a background job is created.
      properties:
        id:
          description: Unique identifier for the job, in UUID v4 format.
          example: 9f7b2a35-57ac-4a1c-9c41-83b6c8157af4
          format: uuid
          type: string
        type:
          $ref: '#/components/schemas/job-type'
        status:
          $ref: '#/components/schemas/job-status'
        createdCount:
          description: 'Number of applications imported by this job, excluding the CSV header and including subsequently soft-deleted applications. Available only when polling a completed BULK_UPLOAD_ENTRIES job; omitted from all other responses. Counted from retained job-to-application mappings, not the current list size.

            '
          example: 12
          format: int64
          minimum: 0
          type: integer
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
        mainFeeTotal:
          description: 'Current main fees in GBP for non-deleted applications created by this upload, regardless of payment or remission status. Available only when polling a completed BULK_UPLOAD_ENTRIES job; zero when no applicable fees remain. Calculated on read, so later changes to applications or associated fees can change this value. Omitted from all other responses.

            '
          example: 120.5
          type: number
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
        offsiteFeeTotal:
          description: 'Current applicable offsite fees in GBP for non-deleted applications created by this upload, regardless of payment or remission status. Available only when polling a completed BULK_UPLOAD_ENTRIES job; zero when no applicable fees remain. Calculated on read, not an upload-time snapshot. Omitted from all other responses.

            '
          example: 30.25
          type: number
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
        totalFeeValue:
          description: 'Sum of mainFeeTotal and offsiteFeeTotal in GBP. Available only when polling a completed BULK_UPLOAD_ENTRIES job. Zero when no applicable fees remain; calculated on read. Omitted from all other responses.

            '
          example: 150.75
          type: number
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
        error_description:
          description: 'Details of a failed job. Bulk-upload validation failures may include actionable input errors; unexpected bulk-upload processing failures use a generic message and identify the job reference to quote to support.

            '
          type: string
      required:
      - id
      - status
      - type
      type: object
    bulk-action-selection-type:
      description: How the global bulk action selection should be resolved.
      enum:
      - FILTER
      - IDS
      type: string
    official-type:
      description: The type of Official hearing the application.
      enum:
      - MAGISTRATE
      - CLERK
      example: MAGISTRATE
      type: string
    move-entries-dto:
      additionalProperties: false
      description: Parameters to move entries from one Application List to another.
      properties:
        targetListId:
          description: ID of the **destination** Application List (must differ from the source `listId` in the path).
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          format: uuid
          type: string
        entryIds:
          description: Array of entry IDs to move. All must currently belong to the source list.
          example:
          - 3fa85f64-5717-4562-b3fc-2c963f66afa6
          - 3fa85f64-5717-4562-b3fc-2c963f66afa7
          items:
            format: uuid
            type: string
          minItems: 1
          type: array
          uniqueItems: true
      required:
      - entryIds
      - targetListId
      type: object
    bulk-action-preview-request-dto:
      additionalProperties: false
      description: Request to resolve a global bulk action selection into IDs and row context.
      properties:
        action:
          $ref: '#/components/schemas/bulk-action-type'
        selection:
          $ref: '#/components/schemas/bulk-action-selection-dto'
      required:
      - action
      - selection
      type: object
    bulk-officials-update-dto:
      additionalProperties: false
      description: Replace officials for multiple Application List Entries in one atomic operation.
      properties:
        entryIds:
          description: Array of entry IDs whose officials should be replaced. All must belong to the list in the path.
          example:
          - 3fa85f64-5717-4562-b3fc-2c963f66afa6
          - 3fa85f64-5717-4562-b3fc-2c963f66afa7
          items:
            format: uuid
            type: string
          minItems: 1
          type: array
        officials:
          description: An array of Officials who will decide the outcome of each selected Application. A maximum of 4 officials may be supplied, with no more than 3 MAGISTRATE entries and no more than 1 CLERK entry.
          items:
            $ref: '#/components/schemas/official'
          maxItems: 4
          type: array
      required:
      - entryIds
      - officials
      type: object
    entry-page_1:
      allOf:
      - $ref: '#/components/schemas/page'
      - properties:
          content:
            items:
              $ref: '#/components/schemas/entry-get-summary-dto'
            type: array
        type: object
    bulk-action-selection-dto:
      additionalProperties: false
      description: 'Selection criteria for a global bulk action preview. When selectionType is IDS, entryIds must contain at least one non-null entry ID. When selectionType is FILTER, filter, sort, and excludedEntryIds describe the select-all-matching selection.

        '
      properties:
        selectionType:
          $ref: '#/components/schemas/bulk-action-selection-type'
        filter:
          $ref: '#/components/schemas/entry-get-filter-dto'
        sort:
          description: 'Sort order for the resolved selection. A single value is currently supported. Format: `property,(asc|desc)`.

            '
          example:
          - date,desc
          items:
            type: string
          type: array
        entryIds:
          description: Explicitly selected Application List Entry IDs.
          items:
            format: uuid
            type: string
          minItems: 1
          type: array
        excludedEntryIds:
          description: Entry IDs excluded from a select-all-matching filter selection.
          items:
            format: uuid
            type: string
          type: array
      required:
      - selectionType
      type: object
    entry_update_closed_dto:
      additionalProperties: false
      description: 'Request payload to update notes for an Application List Entry whose Application List is closed.

        '
      properties:
        additionalNotes:
          description: 'The additional notes to append to the Application List Entry. Empty values are accepted and leave existing notes unchanged.

            '
          example: Additional notes
          maxLength: 4000
          minLength: 0
          type: string
      required:
      - additionalNotes
      type: object
    bulk-update-response-dto:
      description: Result of a bulk update operation.
      properties:
        totalCount:
          description: Total number of records requested for update.
          example: 2
          format: int32
          minimum: 0
          type: integer
        updatedCount:
          description: Number of records updated.
          example: 2
          format: int32
          minimum: 0
          type: integer
        status:
          description: Overall status of the bulk update operation.
          enum:
          - SUCCEEDED
          - FAILED
          example: SUCCEEDED
          type: string
      required:
      - status
      - totalCount
      - updatedCount
      type: object
    entry-update-dto:
      additionalProperties: false
      description: 'Request payload to update an Application List Entry. Note, this is a PUT operation so the whole object is replaced. When `feeStatuses` is supplied it replaces the existing fee-status rows for the entry. When `feeStatuses` is `null`, fee-status rows are left unchanged. Blank fields will be rejected, nulls should be used instead.

        '
      properties:
        standardApplicantCode:
          description: Code that identifies the Standard Applicant.
          example: APP001
          maxLength: 10
          minLength: 1
          type: string
        applicationCode:
          description: Code that identifies the Application Code.
          example: APP001
          maxLength: 10
          minLength: 1
          type: string
        applicant:
          $ref: '#/components/schemas/applicant'
        respondent:
          $ref: '#/components/schemas/respondent'
        numberOfRespondents:
          description: Number of respondents required by the Application.
          example: 0
          format: int16
          type: integer
        wordingFields:
          description: An array of user-provided values used to populate placeholders in the entry wording template, applied in the order they are provided.
          items:
            $ref: '#/components/schemas/template-substitution'
          type: array
        feeStatuses:
          description: 'Fee-status rows to persist for the entry. Providing a list replaces the existing fee-status rows. `null` means the existing fee-status rows are left unchanged. For application codes that do not require a fee, this operation allows existing historical fee-status rows to be retained unchanged, but rejects new, changed, or cleared fee-status rows.

            '
          items:
            $ref: '#/components/schemas/fee-status'
          type: array
        hasOffsiteFee:
          description: Indicates whether an off-site fee applies.
          example: true
          type: boolean
        caseReference:
          description: A reference code to identify a related case (maximum 15 characters).
          example: CASE-001
          maxLength: 15
          minLength: 1
          type: string
        accountNumber:
          description: The Applicant's account number (maximum 20 characters). Required when the Application Code starts with EF.
          example: ACC-001
          maxLength: 20
          minLength: 1
          type: string
        notes:
          description: Notes about the application or the hearing (maximum 4000 characters).
          example: Time is 10:31, we have convened to talk about Application...
          maxLength: 4000
          minLength: 1
          type: string
        officials:
          description: An array of Officials who will decide the outcome of the Application. A maximum of 4 officials may be supplied, with no more than 3 MAGISTRATE entries and no more than 1 CLERK entry.
          items:
            $ref: '#/components/schemas/official'
          maxItems: 4
          type: array
      required:
      - applicationCode
      type: object
    application-list-entry-bulk-action-preview-request-dto:
      additionalProperties: false
      description: Request to resolve a single-list bulk action selection into IDs and row context.
      properties:
        action:
          $ref: '#/components/schemas/bulk-action-type'
        selection:
          $ref: '#/components/schemas/application-list-entry-bulk-action-selection-dto'
      required:
      - action
      - selection
      type: object
    payment-status:
      description: The Status of the Fee's Payment.
      enum:
      - PAID
      - UNDERTAKEN
      - DUE
      - REMITTED
      example: PAID
      type: string
