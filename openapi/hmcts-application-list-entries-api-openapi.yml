  /application-lists/{listId}/entries/officials:
    post:
      description: 'Atomically replaces the full officials array for each specified entry in the source list (path `listId`). If any entry cannot be updated, no officials are changed. NOTE: Duplicate entryIds will result in an error'
      operationId: replaceApplicationListEntryOfficials
      parameters:
      - description: ID of the Application List that owns the entries whose officials will be replaced.
        example: 9f7b2a35-57ac-4a1c-9c41-83b6c8157af4
        in: path
        name: listId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/vnd.hmcts.appreg.v1+json:
            schema:
              $ref: '#/components/schemas/bulk-officials-update-dto'
        required: true
      responses:
        '204':
          description: Officials replaced for all entries. No response body.
          headers:
