components:
  schemas:
    page:
      description: Generic Spring Data page.
      properties:
        pageNumber:
          description: Zero-based page index.
          format: int32
          type: integer
        pageSize:
          description: Page size.
          format: int32
          type: integer
        totalElements:
          description: Total number of elements across all pages.
          format: int64
          type: integer
        totalPages:
          description: Total number of pages.
          format: int32
          type: integer
        sort:
          $ref: '#/components/schemas/sort'
        first:
          type: boolean
        last:
          type: boolean
        elementsOnPage:
          description: Total number of elements in the current page.
          format: int32
          type: integer
      required:
      - content
      - elementsOnPage
      - pageNumber
      - pageSize
      - totalElements
      type: object
    template-key-with-constraint:
      description: The template field with an associated value
      properties:
        key:
          description: Field key for substitution into the template.
          example: account-number
          type: string
        value:
          description: The optional value for the key.
          example: '12345678'
          type: string
        constraint:
          allOf:
          - $ref: '#/components/schemas/template-constraint'
          description: The constraint details for the field
      required:
      - constraint
      - key
      type: object
    entry-create-dto:
      additionalProperties: false
      description: Request payload to create an Application List Entry. Blank fields will be rejected, nulls should be used instead.
      properties:
        standardApplicantCode:
          description: Code that identifies the Standard Applicant.
          example: APP001
          maxLength: 10
          minLength: 1
          type: string
        applicationCode:
          description: Code that identifies the Application Code.
          example: APP001
          maxLength: 10
          minLength: 1
          type: string
        applicant:
          $ref: '#/components/schemas/applicant'
        respondent:
          $ref: '#/components/schemas/respondent'
        numberOfRespondents:
          description: Number of respondents required by the Application.
          example: 0
          format: int16
          type: integer
        wordingFields:
          description: 'An array of user-provided values used to populate placeholders in the ''wording''. The wording is a field belonging to the linked Application Code. Each string is applied to the wording in the order they are provided.

            '
          items:
            $ref: '#/components/schemas/template-substitution'
          type: array
        feeStatuses:
          description: Fee-status rows for the entry. Must only be supplied when the selected application code requires a fee.
          items:
            $ref: '#/components/schemas/fee-status'
          type: array
        hasOffsiteFee:
          description: Indicates whether an off-site fee applies.
          example: true
          type: boolean
