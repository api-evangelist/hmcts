openapi: 3.2.0
info:
  contact:
    name: HMCTS AppReg Team
    url: https://github.com/hmcts/appreg-api
  description: REST API for managing Administrative Tasks, Applications Lists, Application List Entries and getting important, reference data including Application Codes, Result Codes, Fees, Court Locations, Criminal Justice Areas and Standard Applicants.
  title: Applications Register Application List Entries API
  version: '@version@'
servers:
- url: /
tags:
- description: An Application List Entry records all details of an individual Application. This will always belong to an Application List.
  name: application-list-entries
paths:
  /application-list-entries:
    get:
      description: Returns a paginated list of Application Lists Entries that match the search filters, without using an Application List ID .
      operationId: getEntries
      parameters:
      - description: Filter criteria for Application Lists Entries.
        explode: true
        in: query
        name: filter
        required: false
        schema:
          $ref: '#/components/schemas/entry-get-filter-dto'
        style: form
      - in: query
        name: pageNumber
        schema:
          default: 0
          minimum: 0
          type: integer
      - in: query
        name: pageSize
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      - description: 'Sort order. A single value is currently supported. Format: `property,(asc|desc)`.

          Supported properties are date, applicantName, respondentName, applicationTitle,

          feeRequired, resulted, isResulted, and status. resulted sorts by the result code;

          isResulted sorts by whether the entry has been resulted.

          '
        explode: true
        in: query
        name: sort
        schema:
          example:
          - date,desc
          items:
            type: string
          type: array
        style: form
      responses:
        '200':
          content:
            application/vnd.hmcts.appreg.v1+json:
              schema:
                $ref: '#/components/schemas/entry-page'
          description: Page of Application List Entries
          headers:
            Vary:
              description: Response varies by Accept for media-type versioning.
              schema:
                example: Accept
                type: string
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem'
          description: Invalid request parameters.
        '401':
          content:
            application/problem+json:
              examples:
                unauthenticated:
                  value:
                    type: https://errors.hmcts.net/common/unauthorized
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid credentials
              schema:
                $ref: '#/components/schemas/problem'
          description: Authentication required or token invalid.
        '403':
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    type: https://errors.hmcts.net/common/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not have permission to access this resource
              schema:
                $ref: '#/components/schemas/problem'
          description: Authenticated but not permitted to perform this action.
        '406':
          content:
            application/problem+json:
              examples:
                notAcceptable:
                  value:
                    type: https://errors.hmcts.net/common/not-acceptable
                    title: Not Acceptable
                    status: 406
                    detail: Requested media type/version not acceptable
              schema:
                $ref: '#/components/schemas/problem'
          description: Requested media type/version not acceptable.
        '500':
          content:
            application/problem+json:
              examples:
                generic:
                  value:
                    type: https://errors.hmcts.net/common/internal-error
                    title: Internal Server Error
                    status: 500
                    detail: An unexpected error occurred
              schema:
                $ref: '#/components/schemas/problem'
          description: Unexpected server error.
      summary: Get all Entries (paginated, filterable)
      tags:
      - application-list-entries
  /application-list-entries/bulk-action-preview:
    post:
      description: Resolves the current global Application List Entry selection into entry IDs and row context for the next bulk action page, enforcing the configured global bulk action limit.
      operationId: bulkActionPreview
      requestBody:
        content:
          application/vnd.hmcts.appreg.v1+json:
            schema:
              $ref: '#/components/schemas/bulk-action-preview-request-dto'
        required: true
      responses:
        '200':
          content:
            application/vnd.hmcts.appreg.v1+json:
              schema:
                $ref: '#/components/schemas/bulk-action-preview-response-dto'
          description: Bulk action preview for the resolved selection.
          headers:
            Vary:
              description: Response varies by Accept for media-type versioning.
              schema:
                example: Accept
                type: string
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem'
          description: Invalid request parameters.
        '401':
          content:
            application/problem+json:
              examples:
                unauthenticated:
                  value:
                    type: https://errors.hmcts.net/common/unauthorized
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid credentials
              schema:
                $ref: '#/components/schemas/problem'
          description: Authentication required or token invalid.
        '403':
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    type: https://errors.hmcts.net/common/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not have permission to access this resource
              schema:
                $ref: '#/components/schemas/problem'
          description: Authenticated but not permitted to perform this action.
        '406':
          content:
            application/problem+json:
              examples:
                notAcceptable:
                  value:
                    type: https://errors.hmcts.net/common/not-acceptable
                    title: Not Acceptable
                    status: 406
                    detail: Requested media type/version not acceptable
              schema:
                $ref: '#/components/schemas/problem'
          description: Requested media type/version not acceptable.
        '413':
          content:
            application/problem+json:
              examples:
                payload-too-large:
                  value:
                    type: https://errors.hmcts.net/common/payload-too-large
                    title: Payload Too Large
                    status: 413
                    detail: Uploaded file must not be larger than 5MB
              schema:
                $ref: '#/components/schemas/problem'
          description: Request entity is too large to be processed.
        '500':
          content:
            application/problem+json:
              examples:
                generic:
                  value:
                    type: https://errors.hmcts.net/common/internal-error
                    title: Internal Server Error
                    status: 500
                    detail: An unexpected error occurred
              schema:
                $ref: '#/components/schemas/problem'
          description: Unexpected server error.
      summary: Resolve global bulk action selection preview
      tags:
      - application-list-entries
  /application-lists/{listId}/entries:
    get:
      description: Returns a paginated list of Application List Entries linked to a specific Application List.
      operationId: getApplicationListEntries
      parameters:
      - description: Public identifier of the Application List.
        example: 123e4567-e89b-12d3-a456-426655440000
        in: path
        name: listId
        required: true
        schema:
          format: uuid
          type: string
      - description: Filter criteria for Application List Entries.
        explode: true
        in: query
        name: filter
        required: false
        schema:
          $ref: '#/components/schemas/entry-application-list-get-filter-dto'
        style: form
      - in: query
        name: pageNumber
        schema:
          default: 0
          minimum: 0
          type: integer
      - in: query
        name: pageSize
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      - description: 'Sort order. A single value is currently supported. Format: `property,(asc|desc)`. Supported properties are sequenceNumber, applicationTitle, applicantName, respondentName, respondentPostcode, accountReference, feeRequired, and resulted. applicantName sorts by organisation name for organisation applicants, otherwise by first name and last name.

          '
        explode: true
        in: query
        name: sort
        schema:
          example:
          - applicantName,asc
          items:
