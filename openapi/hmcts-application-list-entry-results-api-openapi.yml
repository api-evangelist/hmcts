components:
  schemas:
    bulk-result-dto:
      additionalProperties: false
      description: Create the same Result for multiple entries (atomic operation).
      properties:
        entryIds:
          description: Array of entry IDs to result. All must belong to the list in the path.
          example:
          - 3fa85f64-5717-4562-b3fc-2c963f66afa6
          - 3fa85f64-5717-4562-b3fc-2c963f66afa7
          items:
            format: uuid
            type: string
          minItems: 1
          type: array
        result:
          $ref: '#/components/schemas/result-create-dto'
      required:
      - entryIds
      - result
      type: object
    result-update-dto:
      additionalProperties: false
      description: Request payload to update an Application List Entry Result. Blank fields will be rejected, nulls should be used instead.
      properties:
        resultCode:
          description: Code that identifies the Result Code.
          example: RC-001
          maxLength: 10
          minLength: 1
          type: string
        wordingFields:
          description: 'An array of user-provided values used to populate placeholders in the ''wording''. The wording is a field belonging to the linked Result Code. Each string is applied to the wording in the order they are provided.

            '
          items:
            $ref: '#/components/schemas/template-substitution'
          type: array
      required:
      - resultCode
      type: object
    bulk-delete-results-dto:
      additionalProperties: false
      description: Delete multiple Application List Entry Results atomically.
      properties:
        results:
          description: 'Result delete requests to execute. Each item is validated using the same rules as the single-result delete endpoint. If any item is invalid, no results are deleted.

            '
          items:
            $ref: '#/components/schemas/bulk-delete-result-item-dto'
          minItems: 1
          type: array
      required:
      - results
      type: object
    template-constraint:
      description: The template field with an associated value
      properties:
        type:
          description: The data type of the value.
          enum:
          - TEXT
          example: TEXT
          type: string
        length:
          description: The length of the data value.
          example: 1234
          type: integer
      required:
      - length
      - type
      type: object
    template-detail:
      description: The wording details
      properties:
        template:
          description: The template name. It contains the field names between curly braces.
          example: This is a test {{Applicant number}} with a date
          type: string
        substitution-key-constraints:
          description: A list of fields and the associated constraints
          items:
            $ref: '#/components/schemas/template-key-with-constraint'
          type: array
      required:
      - template
      type: object
    result-create-dto:
      additionalProperties: false
      description: Request payload to create an Application List Entry Result. Blank fields will be rejected, nulls should be used instead.
      properties:
        resultCode:
          description: Code that identifies the Result Code.
          example: RC-001
          maxLength: 10
          minLength: 1
          type: string
        wordingFields:
          description: 'An array of user-provided values used to populate placeholders in the ''wording''. The wording is a field belonging to the linked Result Code. Each string is applied to the wording in the order they are provided.

            '
          items:
            $ref: '#/components/schemas/template-substitution'
          type: array
      required:
      - resultCode
      type: object
    result-get-dto:
      description: Response payload to get an Application List Entry Result.
      properties:
        id:
          description: Unique identifier of the Application List Entry Result.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          format: uuid
          type: string
        entryId:
          description: The Unique identifier of the parent Application List Entry belongs.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          format: uuid
          type: string
        resultCode:
          description: Code that identifies the Result Code.
          example: RC-001
          type: string
        updatedDateTime:
          description: Date and time the Application List Entry Result was last updated.
          example: 2026-08-28 10:15:30+00:00
          format: date-time
          type: string
        wording:
          $ref: '#/components/schemas/template-detail'
      required:
      - entryId
      - id
      - resultCode
      - updatedDateTime
      type: object
    sort_orders_inner:
      properties:
        property:
          description: Property name used for sorting.
          example: title
          type: string
        direction:
          description: Sort direction.
          enum:
          - asc
          - desc
          example: asc
          type: string
      required:
      - direction
      - property
      type: object
    page:
      description: Generic Spring Data page.
      properties:
        pageNumber:
          description: Zero-based page index.
          format: int32
          type: integer
        pageSize:
          description: Page size.
          format: int32
          type: integer
        totalElements:
          description: Total number of elements across all pages.
          format: int64
          type: integer
        totalPages:
          description: Total number of pages.
          format: int32
          type: integer
        sort:
          $ref: '#/components/schemas/sort'
        first:
          type: boolean
        last:
          type: boolean
        elementsOnPage:
          description: Total number of elements in the current page.
          format: int32
          type: integer
      required:
      - content
      - elementsOnPage
      - pageNumber
      - pageSize
      - totalElements
      type: object
    template-substitution:
      additionalProperties: false
      description: The template field with the associated value to substitute. Blank fields will be rejected, nulls should be used instead.
      properties:
        key:
          description: Field key for substitution into the template.
          example: account-number
          minLength: 1
          type: string
        value:
          description: The field value to substitute into the template key. Braces and line breaks are not permitted.
          example: '1234'
          minLength: 1
          type: string
      required:
      - key
      - value
      type: object
    sort:
