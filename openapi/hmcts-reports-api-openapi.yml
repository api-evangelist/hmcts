                    title: Forbidden
                    status: 403
                    detail: You do not have permission to access this resource
              schema:
                $ref: '#/components/schemas/problem'
          description: Authenticated but not permitted to perform this action.
        '404':
          content:
            application/problem+json:
              examples:
                missing:
                  value:
                    type: https://errors.hmcts.net/appreg/not-found
                    title: Not Found
                    status: 404
                    detail: Result code with id=123 was not found
              schema:
                $ref: '#/components/schemas/problem'
          description: The requested resource was not found.
        '409':
          content:
            application/problem+json:
              examples:
                generic:
                  value:
                    type: https://errors.hmcts.net/common/conflict
                    title: Conflict
                    status: 409
                    detail: The Application List could not be modified due to a conflict with its current state
              schema:
                $ref: '#/components/schemas/problem'
          description: Conflict with the current state of the resource.
        '500':
          content:
            application/problem+json:
              examples:
                generic:
                  value:
                    type: https://errors.hmcts.net/common/internal-error
                    title: Internal Server Error
                    status: 500
                    detail: An unexpected error occurred
              schema:
                $ref: '#/components/schemas/problem'
          description: Unexpected server error.
      summary: Download the generated CSV for a completed report job
      tags:
      - Reports
components:
  schemas:
    legacy-report-location:
      additionalProperties: false
      description: 'Location filters for legacy MIS reports. Blank fields will be rejected, nulls should be used instead. Location filters are optional. Use courtLocationCode on its own, cjaCode on its own, otherLocationDescription on its own, or cjaCode and otherLocationDescription together. courtLocationCode is mutually exclusive with cjaCode and otherLocationDescription.

        '
      properties:
        courtLocationCode:
          description: Court location code (case-insensitive contains match).
          example: LOC123
          maxLength: 10
          minLength: 1
          pattern: .*\S.*
          type: string
        otherLocationDescription:
          description: Other location description (case-insensitive contains match).
          example: town hall
          maxLength: 200
          minLength: 1
          pattern: .*\S.*
          type: string
        cjaCode:
          description: 'Criminal Justice Area code. Can be supplied on its own or with otherLocationDescription.

            '
          example: '52'
          maxLength: 2
          minLength: 1
          pattern: .*\S.*
          type: string
      title: LegacyReportLocation
      type: object
    private-prosecutors-index-filter-dto:
      additionalProperties: false
      description: 'Filter criteria for POST /reports/private-prosecutors-index/jobs. Both dateFrom and dateTo are required and are treated as inclusive bounds. Blank fields will be rejected, nulls should be used instead.

        '
      properties:
        dateFrom:
          description: Inclusive start date (YYYY-MM-DD).
          example: 2025-10-01
          format: date
          type: string
        dateTo:
          description: Inclusive end date (YYYY-MM-DD).
          example: 2025-10-31
          format: date
          type: string
        location:
          $ref: '#/components/schemas/legacy-report-location'
        applicantSurname:
          description: Applicant surname (case-insensitive contains match).
          example: Smith
          maxLength: 100
          minLength: 1
          pattern: .*\S.*
          type: string
        applicantFirstName:
          description: Applicant first name (case-insensitive contains match).
          example: John
          maxLength: 100
          minLength: 1
          pattern: .*\S.*
          type: string
        applicantOrganisationName:
          description: Applicant organisation name (case-insensitive contains match).
          example: Acme Corp
          maxLength: 100
          minLength: 1
          pattern: .*\S.*
          type: string
        standardApplicantName:
          description: Standard applicant name (case-insensitive contains match).
          example: Crown Prosecution Service
          maxLength: 100
          minLength: 1
          pattern: .*\S.*
          type: string
        respondentSurname:
          description: Respondent surname (case-insensitive contains match).
          example: Doe
          maxLength: 100
          minLength: 1
          pattern: .*\S.*
          type: string
        respondentFirstName:
          description: Respondent first name (case-insensitive contains match).
          example: Jane
          maxLength: 100
          minLength: 1
          pattern: .*\S.*
          type: string
        respondentOrganisationName:
          description: Respondent organisation name (case-insensitive contains match).
          example: XYZ Ltd
          maxLength: 100
          minLength: 1
          pattern: .*\S.*
          type: string
      required:
      - dateFrom
      - dateTo
      type: object
    search-warrants-report-filter-dto:
      additionalProperties: false
      description: 'Filter criteria for POST /reports/search-warrants/jobs. Both dateFrom and dateTo are required and are treated as inclusive bounds.

        '
      properties:
        dateFrom:
          description: Inclusive start date (YYYY-MM-DD).
          example: 2025-10-01
          format: date
          type: string
        dateTo:
          description: Inclusive end date (YYYY-MM-DD).
          example: 2025-10-31
          format: date
          type: string
        location:
          $ref: '#/components/schemas/legacy-report-location'
      required:
      - dateFrom
      - dateTo
      type: object
    duration-filter-dto:
      additionalProperties: false
      description: 'Filter criteria for POST /reports/duration/jobs. Both dateFrom and dateTo are required inclusive bounds. If dateFrom is later than dateTo, the API treats the earlier date as the inclusive start and the later date as the inclusive end. Location is optional. When provided, use courtLocationCode on its own, cjaCode on its own, otherLocationDescription on its own, or cjaCode and otherLocationDescription together. When supplied, cjaCode must match an existing Criminal Justice Area and courtLocationCode must match an active Court. Blank fields will be rejected; use null instead.

        '
      properties:
        dateFrom:
          description: Inclusive start date (YYYY-MM-DD).
          example: 2025-10-01
          format: date
          type: string
        dateTo:
          description: Inclusive end date (YYYY-MM-DD).
          example: 2025-10-31
          format: date
          type: string
        location:
          $ref: '#/components/schemas/legacy-report-location'
      required:
      - dateFrom
      - dateTo
      type: object
    job-status:
      description: The status of the job being polled by the user.
      enum:
      - RECEIVED
      - VALIDATING
      - PROCESSING
      - FAILED
      - COMPLETED
      example: RECEIVED
      type: string
    activity-type:
      description: Type of user activity recorded in the audit log.
      enum:
      - ADD_APPLICATION
      - BULK_APPLICATION_UPLOAD
      - BULK_UPDATE_FEE_STATUS
      - BULK_UPDATE_OFFICIALS
      - CREATE_APPLICATION_LIST
      - DELETE_APPLICATION_ENTRY
      - DELETE_APPLICATION_LIST
      - DELETE_RESULT_APPLICATION
      - DELETE_RESULT_LIST
      - DELETE_RESULT_MULTIPLE_APPLICATIONS
      - MOVE_APPLICATION
      - REPORT_CREATED
      - REPORT_DOWNLOADED
      - REPORT_STATUS_TRANSITION
      - RESULT_APPLICATION
      - RESULT_LIST
      - RESULT_MULTIPLE_APPLICATIONS
      - UPDATE_APPLICATION
      - UPDATE_APPLICATION_LIST
      - UPDATE_RESULT_APPLICATION
      - UPDATE_RESULT_LIST
      - UPDATE_RESULT_MULTIPLE_APPLICATIONS
      example: UPDATE_APPLICATION
      title: ActivityType
      type: string
    problem:
      description: RFC 9457/7807 problem details.
      properties:
        type:
          description: Problem type identifier (URI).
          example: https://errors.hmcts.net/appreg/bad-request
          format: uri
          type: string
        title:
          description: Short, human-readable summary.
          example: Invalid request parameters
          type: string
        status:
          description: HTTP status code.
          example: 400
          format: int32
          type: integer
        detail:
          description: Human-readable explanation specific to this occurrence.
          example: startDateFrom must be on or before startDateTo
          type: string
        instance:
          description: URI reference to the specific occurrence (if applicable).
          example: urn:request:2f9c3d8a-1b3a-4a1e-9b7f-6b2a6a0a2b2f
          format: uri
          type: string
        correlationId:
