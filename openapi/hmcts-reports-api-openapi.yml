    fees-report-filter-dto:
      additionalProperties: false
      description: 'Filter criteria for POST /reports/fees/jobs. Both dateFrom and dateTo are required and are treated as inclusive bounds. If dateFrom is later than dateTo, the API treats the earlier date as the inclusive start and the later date as the inclusive end. Location is optional. When provided, use courtLocationCode on its own, cjaCode on its own, otherLocationDescription on its own, or cjaCode and otherLocationDescription together. When supplied, cjaCode must match an existing Criminal Justice Area and courtLocationCode must match an active Court.

        '
      properties:
        dateFrom:
          description: Inclusive start date (YYYY-MM-DD).
          example: 2025-10-01
          format: date
          type: string
        dateTo:
          description: Inclusive end date (YYYY-MM-DD).
          example: 2025-10-31
          format: date
          type: string
        standardApplicantCode:
          description: Standard applicant code (case-insensitive contains match).
          example: STD-00123
          maxLength: 10
          minLength: 1
          pattern: .*\S.*
          type: string
        applicantName:
          description: Applicant name, surname, or organisation name (case-insensitive contains match).
          example: john smith
          maxLength: 100
          minLength: 1
          pattern: .*\S.*
          type: string
        location:
          $ref: '#/components/schemas/legacy-report-location'
      required:
      - dateFrom
      - dateTo
      type: object
    activity-audit-filter-dto:
      additionalProperties: false
      description: 'Filter criteria for POST /reports/activity-audit/jobs. Both dateFrom and dateTo are required and are treated as inclusive bounds. If dateFrom is later than dateTo, the API treats the earlier date as the inclusive start and the later date as the inclusive end. The username must match exactly. Blank fields will be rejected, nulls should be used instead.

        '
      properties:
