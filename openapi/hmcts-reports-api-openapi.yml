  /reports/jobs/{jobId}/download:
    get:
      description: Streams the generated CSV from the database for the specified job. The job must be in the `completed` state.
      operationId: downloadReport
      parameters:
      - description: The unique identifier of the report job.
        example: 9f7b2a35-57ac-4a1c-9c41-83b6c8157af4
        in: path
        name: jobId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            text/csv:
              schema:
                format: binary
                type: string
          description: The generated CSV report.
          headers:
            Content-Disposition:
              description: Suggested filename for the downloaded CSV.
              schema:
                example: attachment; filename="report.csv"
                type: string
            Vary:
              description: Response varies by Accept for media-type versioning.
              schema:
                example: Accept
                type: string
        '401':
          content:
            application/problem+json:
              examples:
                unauthenticated:
                  value:
                    type: https://errors.hmcts.net/common/unauthorized
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid credentials
