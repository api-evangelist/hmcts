openapi: 3.2.0
info:
  title: Hmcts Application Lists API
  version: '@version@'
  contact:
    name: HMCTS AppReg Team
    url: https://github.com/hmcts/appreg-api
  description: 'Operations tagged application-lists across 2 of this provider''s published API definitions: appreg-api-openapi.yaml, hmcts-applications-register-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /
tags:
- description: An Application List records the date, time and location at which one or more Applications is to be considered by a magistrate or delegated authority.
  name: application-lists
paths:
  /application-lists:
    get:
      description: Returns a paginated list of Application Lists.
      operationId: getApplicationLists
      parameters:
      - description: Filter criteria for Application Lists.
        explode: true
        in: query
        name: filter
        required: false
        schema:
          $ref: '#/components/schemas/application-list-get-filter-dto'
        style: form
      - in: query
        name: pageNumber
        schema:
          default: 0
          minimum: 0
          type: integer
      - in: query
        name: pageSize
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      - description: 'Sort parameter. Format: `property,(asc|desc)`. Currently only a single sort value is supported. Example: `?sort=date,desc`.

          '
        explode: true
        in: query
        name: sort
        schema:
          example:
          - date,desc
          items:
            type: string
          type: array
        style: form
      responses:
        '200':
          content:
            application/vnd.hmcts.appreg.v1+json:
              schema:
                $ref: '#/components/schemas/application-list-page'
          description: Page of Application Lists
          headers:
            Vary:
              description: Response varies by Accept for media-type versioning.
              schema:
                example: Accept
                type: string
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem'
          description: Invalid request parameters.
        '401':
          content:
            application/problem+json:
              examples:
                unauthenticated:
                  value:
                    type: https://errors.hmcts.net/common/unauthorized
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid credentials
              schema:
                $ref: '#/components/schemas/problem'
          description: Authentication required or token invalid.
        '403':
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    type: https://errors.hmcts.net/common/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not have permission to access this resource
              schema:
                $ref: '#/components/schemas/problem'
          description: Authenticated but not permitted to perform this action.
        '406':
          content:
            application/problem+json:
              examples:
                notAcceptable:
                  value:
                    type: https://errors.hmcts.net/common/not-acceptable
                    title: Not Acceptable
                    status: 406
                    detail: Requested media type/version not acceptable
              schema:
                $ref: '#/components/schemas/problem'
          description: Requested media type/version not acceptable.
        '500':
          content:
            application/problem+json:
              examples:
                generic:
                  value:
                    type: https://errors.hmcts.net/common/internal-error
                    title: Internal Server Error
                    status: 500
                    detail: An unexpected error occurred
              schema:
                $ref: '#/components/schemas/problem'
          description: Unexpected server error.
      summary: Get Application Lists (paginated, filterable)
      tags:
      - application-lists
    post:
      description: Creates a new Application List from the supplied request body.
      operationId: createApplicationList
      requestBody:
        content:
          application/vnd.hmcts.appreg.v1+json:
            schema:
              $ref: '#/components/schemas/application-list-create-dto'
        required: true
      responses:
        '201':
          content:
            application/vnd.hmcts.appreg.v1+json:
              schema:
                $ref: '#/components/schemas/application-list-get-detail-dto'
          description: Application List created
          headers:
            Location:
              description: URL of the created Application List
              schema:
                type: string
            Vary:
              description: Response varies by Accept for media-type versioning.
              schema:
                example: Accept
                type: string
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem'
          description: Invalid request parameters.
        '401':
          content:
            application/problem+json:
              examples:
                unauthenticated:
                  value:
                    type: https://errors.hmcts.net/common/unauthorized
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid credentials
              schema:
                $ref: '#/components/schemas/problem'
          description: Authentication required or token invalid.
        '403':
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    type: https://errors.hmcts.net/common/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not have permission to access this resource
              schema:
                $ref: '#/components/schemas/problem'
          description: Authenticated but not permitted to perform this action.
        '500':
          content:
            application/problem+json:
              examples:
                generic:
                  value:
                    type: https://errors.hmcts.net/common/internal-error
                    title: Internal Server Error
                    status: 500
                    detail: An unexpected error occurred
              schema:
                $ref: '#/components/schemas/problem'
          description: Unexpected server error.
      summary: Create an Application List
      tags:
      - application-lists
    servers:
    - url: /
  /application-lists/print:
    post:
      description: Returns print-oriented Application Lists for one or more Application Lists in a single request. Supply `listIds` to scope the search. If `entryIds` is omitted or empty, all active entries from the supplied lists are returned. If `entryIds` is supplied, only the specified active entries from the supplied lists are returned within each returned list. Validation is all-or-nothing.
      operationId: printApplicationLists
      requestBody:
        content:
          application/vnd.hmcts.appreg.v1+json:
            schema:
              $ref: '#/components/schemas/bulk-get-application-list-entries-request-dto'
        required: true
      responses:
        '200':
          content:
            application/vnd.hmcts.appreg.v1+json:
              schema:
                items:
                  $ref: '#/components/schemas/application-list-get-print-dto'
                type: array
          description: Matching print-ready Application Lists in input order.
          headers:
            Vary:
              description: Response varies by Accept for media-type versioning.
              schema:
                example: Accept
                type: string
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem'
          description: Invalid request parameters.
        '401':
          content:
            application/problem+json:
              examples:
                unauthenticated:
                  value:
                    type: https://errors.hmcts.net/common/unauthorized
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid credentials
              schema:
                $ref: '#/components/schemas/problem'
          description: Authentication required or token invalid.
        '403':
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    type: https://errors.hmcts.net/common/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not have permission to access this resource
              schema:
                $ref: '#/components/schemas/problem'
          description: Authenticated but not permitted to perform this action.
        '404':
          content:
            application/problem+json:
              examples:
                missing:
                  value:
                    type: https://errors.hmcts.net/appreg/not-found
                    title: Not Found
                    status: 404
                    detail: Result code with id=123 was not found
              schema:
                $ref: '#/components/schemas/problem'
          description: The requested resource was not found.
        '406':
          content:
            application/problem+json:
              examples:
                notAcceptable:
                  value:
                    type: https://errors.hmcts.net/common/not-acceptable
                    title: Not Acceptable
                    status: 406
                    detail: Requested media type/version not acceptable
              schema:
                $ref: '#/components/schemas/problem'
          description: Requested media type/version not acceptable.
        '500':
          content:
            application/problem+json:
              examples:
                generic:
                  value:
                    type: https://errors.hmcts.net/common/internal-error
                    title: Internal Server Error
                    status: 500
                    detail: An unexpected error occurred
              schema:
                $ref: '#/components/schemas/problem'
          description: Unexpected server error.
      summary: Get print-ready Application Lists in bulk
      tags:
      - application-lists
    servers:
    - url: /
  /application-lists/{listId}:
    delete:
      description: Permanently deletes the Application List identified by `listId`.
      operationId: deleteApplicationList
      parameters:
      - description: Public identifier of the Application List.
        example: 123e4567-e89b-12d3-a456-426655440000
        in: path
        name: listId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Application List deleted (no content)
          headers:
            Vary:
              description: Response varies by Accept for media-type versioning.
              schema:
                example: Accept
                type: string
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem'
          description: Invalid request parameters.
        '401':
          content:
            application/problem+json:
              examples:
                unauthenticated:
                  value:
                    type: https://errors.hmcts.net/common/unauthorized
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid credentials
              schema:
                $ref: '#/components/schemas/problem'
          description: Authentication required or token invalid.
        '403':
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    type: https://errors.hmcts.net/common/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not have permission to access this resource
              schema:
                $ref: '#/components/schemas/problem'
          description: Authenticated but not permitted to perform this action.
        '404':
          content:
            application/problem+json:
              examples:
                missing:
                  value:
                    type: https://errors.hmcts.net/appreg/not-found
                    title: Not Found
                    status: 404
                    detail: Result code with id=123 was not found
              schema:
                $ref: '#/components/schemas/problem'
          description: The requested resource was not found.
        '409':
          content:
            application/problem+json:
              examples:
                generic:
                  value:
                    type: https://errors.hmcts.net/common/conflict
                    title: Conflict
                    status: 409
                    detail: The Application List could not be modified due to a conflict with its current state
              schema:
                $ref: '#/components/schemas/problem'
          description: Conflict with the current state of the resource.
        '500':
          content:
            application/problem+json:
              examples:
                generic:
                  value:
                    type: https://errors.hmcts.net/common/internal-error
                    title: Internal Server Error
                    status: 500
                    detail: An unexpected error occurred
              schema:
                $ref: '#/components/schemas/problem'
          description: Unexpected server error.
      summary: Delete an Application List
      tags:
      - application-lists
    get:
      description: Returns the Application List identified by `listId`.
      operationId: getApplicationList
      parameters:
      - description: Public identifier of the Application List.
        example: 123e4567-e89b-12d3-a456-426655440000
        in: path
        name: listId
        required: true
        schema:
          format: uuid
          type: string
      - description: Zero-based page index.
        in: query
        name: pageNumber
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
      - description: Page size.
        in: query
        name: pageSize
        schema:
          default: 10
          format: int32
          maximum: 100
          minimum: 1
          type: integer
      - description: 'Sort parameter. Format: `property,(asc|desc)`. Currently only a single sort value is supported. Example: `?sort=name,asc`.

          '
        explode: true
        in: query
        name: sort
        schema:
          example:
          - name,asc
          items:
            type: string
          type: array
        style: form
      responses:
        '200':
          content:
            application/vnd.hmcts.appreg.v1+json:
              schema:
                $ref: '#/components/schemas/application-list-get-detail-dto'
          description: Application List detail
          headers:
            Vary:
              description: Response varies by Accept for media-type versioning.
              schema:
                example: Accept
                type: string
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem'
          description: Invalid request parameters.
        '401':
          content:
            application/problem+json:
              examples:
                unauthenticated:
                  value:
                    type: https://errors.hmcts.net/common/unauthorized
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid credentials
              schema:
                $ref: '#/components/schemas/problem'
          description: Authentication required or token invalid.
        '403':
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    type: https://errors.hmcts.net/common/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not have permission to access this resource
              schema:
                $ref: '#/components/schemas/problem'
          description: Authenticated but not permitted to perform this action.
        '404':
          content:
            application/problem+json:
              examples:
                missing:
                  value:
                    type: https://errors.hmcts.net/appreg/not-found
                    title: Not Found
                    status: 404
                    detail: Result code with id=123 was not found
              schema:
                $ref: '#/components/schemas/problem'
          description: The requested resource was not found.
        '500':
          content:
            application/problem+json:
              examples:
                generic:
                  value:
                    type: https://errors.hmcts.net/common/internal-error
                    title: Internal Server Error
                    status: 500
                    detail: An unexpected error occurred
              schema:
                $ref: '#/components/schemas/problem'
          description: Unexpected server error.
      summary: Get an Application List by id
      tags:
      - application-lists
    put:
      description: 'Full replacement (PUT) of an existing Application List. The `id` is taken from the path; the request body must satisfy the same constraints as create (including the XOR location rule: either `courtLocation` or (`otherLocationDescription` + `criminalJusticeAreaCode`)). The request must include a valid `If-Match` header for optimistic concurrency control; a mismatch results in 409 Conflict.'
      operationId: updateApplicationList
      parameters:
      - description: Public identifier of the Application List.
        example: 123e4567-e89b-12d3-a456-426655440000
        in: path
        name: listId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/vnd.hmcts.appreg.v1+json:
            schema:
              $ref: '#/components/schemas/application-list-update-dto'
        required: true
      responses:
        '200':
          content:
            application/vnd.hmcts.appreg.v1+json:
              schema:
                $ref: '#/components/schemas/application-list-get-detail-dto'
          description: Updated Application List
          headers:
            Vary:
              description: Response varies by Accept for media-type versioning.
              schema:
                example: Accept
                type: string
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem'
          description: Invalid request parameters.
        '401':
          content:
            application/problem+json:
              examples:
                unauthenticated:
                  value:
                    type: https://errors.hmcts.net/common/unauthorized
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid credentials
              schema:
                $ref: '#/components/schemas/problem'
          description: Authentication required or token invalid.
        '403':
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    type: https://errors.hmcts.net/common/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not have permission to access this resource
              schema:
                $ref: '#/components/schemas/problem'
          description: Authenticated but not permitted to perform this action.
        '404':
          content:
            application/problem+json:
              examples:
                missing:
                  value:
                    type: https://errors.hmcts.net/appreg/not-found
                    title: Not Found
                    status: 404
                    detail: Result code with id=123 was not found
              schema:
                $ref: '#/components/schemas/problem'
          description: The requested resource was not found.
        '409':
          content:
            application/problem+json:
              examples:
                generic:
                  value:
                    type: https://errors.hmcts.net/common/conflict
                    title: Conflict
                    status: 409
                    detail: The Application List could not be modified due to a conflict with its current state
              schema:
                $ref: '#/components/schemas/problem'
          description: Conflict with the current state of the resource.
        '500':
          content:
            application/problem+json:
              examples:
                generic:
                  value:
                    type: https://errors.hmcts.net/common/internal-error
                    title: Internal Server Error
                    status: 500
                    detail: An unexpected error occurred
              schema:
                $ref: '#/components/schemas/problem'
          description: Unexpected server error.
      summary: Update an Application List
      tags:
      - application-lists
    servers:
    - url: /
components:
  schemas:
    applicant:
      additionalProperties: false
      description: 'The applicant making the application.

        In application read and print responses, Standard Applicants are represented by their

        reference name in organisation.name (or their code when no reference name exists).

        Their personal and contact values are not returned. For these read responses the

        shared input contact constraints do not apply: contact fields may be null or absent.

        Ordinary applicant input still requires the person or organisation contact details.

        '
      properties:
        person:
          $ref: '#/components/schemas/person'
        organisation:
          $ref: '#/components/schemas/organisation'
      type: object
    application-list-update-dto:
      additionalProperties: false
      description: Request payload to fully replace an existing Application List. Blank fields will be rejected, nulls should be used instead.
      properties:
        date:
          description: The calendar date on which the Application List is scheduled.
          example: 2025-09-17
          format: date
          type: string
        time:
          description: The time of day at which the Application List is scheduled.
          example: 37800
          format: time
          type: string
        description:
          description: Human-readable description of the Application List (e.g. session title or purpose).
          example: Morning session for traffic-related applications
          maxLength: 200
          minLength: 1
          type: string
        status:
          $ref: '#/components/schemas/application-list-status'
        otherLocationDescription:
          description: Free-text location if not using a standard court.
          example: Temporary Courtroom at Town Hall
          maxLength: 200
          minLength: 1
          type: string
        courtLocationCode:
          description: Code that identifies the Court Location.
          example: LOC123
          maxLength: 10
          minLength: 1
          type: string
        cjaCode:
          description: Criminal Justice Area code.
          example: CJ
          maxLength: 2
          minLength: 1
          type: string
        durationHours:
          description: Duration hours component.
          example: 2
          format: int32
          maximum: 99
          minimum: 0
          type: integer
        durationMinutes:
          description: Duration minutes component.
          example: 30
          format: int32
          maximum: 59
          minimum: 0
          type: integer
      required:
      - date
      - description
      - status
      - time
      type: object
    entry-get-print-dto:
      description: An application view, used specifically for printing.
      properties:
        id:
          description: Unique identifier of the Application List Entry.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          format: uuid
          type: string
        applicant:
          $ref: '#/components/schemas/applicant'
        respondent:
          $ref: '#/components/schemas/respondent'
        applicationCode:
          description: Code that identifies the application.
          example: AD99001
          type: string
        applicationTitle:
          description: The title of the application.
          example: Appeal to Crown Court
          type: string
        applicationWording:
          description: Full description of the application.
          example: Notice of appeal in respect of a case heard on 10-01-2026
          type: string
        resultWordings:
          description: A list of result wordings for the application.
          example:
          - Appeal forwarded to Bristol Crown Court.
          - Respondent Attended.
          items:
            type: string
          type: array
        officials:
          description: A list of officials that ruled on the application.
          items:
            $ref: '#/components/schemas/official'
          type: array
        caseReference:
          description: A reference code to identify a related case (maximum 15 characters).
          example: CASE-001
          maxLength: 15
          type: string
        accountReference:
          description: The Applicants account number (maximum 20 characters).
          example: CCC-001
          maxLength: 20
          type: string
        notes:
          description: Notes about the application or the hearing (maximum 4000 characters).
          example: Time is 10:31, we have convened to talk about Application...
          maxLength: 4000
          type: string
      required:
      - applicant
      - applicationCode
      - applicationTitle
      - applicationWording
      - id
      type: object
    application-list-get-summary-dto:
      description: Lightweight DTO for Application Lists, used in list/search views.
      properties:
        id:
          description: Unique identifier of the Application List.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          format: uuid
          type: string
        date:
          description: The calendar date on which the Application List is scheduled.
          example: 2025-09-17
          format: date
          type: string
        time:
          description: The time of day at which the Application List is scheduled, seconds are optional.
          example: 37800
          format: time
          type: string
        location:
          description: Location where the applications will be considered.
          example: Bath Magistrates Court
          type: string
        description:
          description: Human-readable description of the Application List (e.g. session title or purpose).
          example: Morning session for traffic-related applications
          type: string
        entriesCount:
          description: Total number of Application List Entries associated with this Application List.
          example: 12
          format: int32
          type: integer
        status:
          $ref: '#/components/schemas/application-list-status'
      required:
      - date
      - description
      - id
      - location
      - numberOfEntries
      - status
      - time
      type: object
    application-list-page:
      allOf:
      - $ref: '#/components/schemas/page'
      - properties:
          content:
            items:
              $ref: '#/components/schemas/application-list-get-summary-dto'
            type: array
        type: object
    sort_orders_inner:
      properties:
        property:
          description: Property name used for sorting.
          example: title
          type: string
        direction:
          description: Sort direction.
          enum:
          - asc
          - desc
          example: asc
          type: string
      required:
      - direction
      - property
      type: object
    problem:
      description: RFC 9457/7807 problem details.
      properties:
        type:
          description: Problem type identifier (URI).
          example: https://errors.hmcts.net/appreg/bad-request
          format: uri
          type: string
        title:
          description: Short, human-readable summary.
          example: Invalid request parameters
          type: string
        status:
          description: HTTP status code.
          example: 400
          format: int32
          type: integer
        detail:
          description: Human-readable explanation specific to this occurrence.
          example: startDateFrom must be on or before startDateTo
          type: string
        instance:
          description: URI reference to the specific occurrence (if applicable).
          example: urn:request:2f9c3d8a-1b3a-4a1e-9b7f-6b2a6a0a2b2f
          format: uri
          type: string
        correlationId:
          description: Server-side correlation ID for tracing.
          example: 3e1a2c95a7d84a5fb3e1a2c95a7d84a5
          type: string
      required:
      - status
      - title
      - type
      type: object
    organisation:
      additionalProperties: false
      description: The organisation making, or responding to, the application. Blank fields will be rejected, nulls should be used instead.
      properties:
        name:
          description: The name of the organisation.
          example: ACME Industries LTD
          maxLength: 100
          minLength: 1
          pattern: ^[^\u0000-\u001F\u007F-\u009F]*$
          type: string
        contactDetails:
          $ref: '#/components/schemas/contact-details'
      required:
      - contactDetails
      - name
      type: object
    official-type:
      description: The type of Official hearing the application.
      enum:
      - MAGISTRATE
      - CLERK
      example: MAGISTRATE
      type: string
    application-list-create-dto:
      additionalProperties: false
      description: Request payload to create an Application List. Blank fields will be rejected, nulls should be used instead.
      properties:
        date:
          description: The calendar date on which the Application List is scheduled.
          example: 2025-09-17
          format: date
          type: string
        time:
          description: The time of day at which the Application List is scheduled, seconds are optional.
          example: 37800
          format: time
          type: string
        description:
          maxLength: 200
          minLength: 1
          type: string
        status:
          $ref: '#/components/schemas/application-list-status'
        courtLocationCode:
          description: Code that identifies the Court Location.
          example: LOC123
          maxLength: 10
          minLength: 1
          type: string
        otherLocationDescription:
          description: Free-text location if not using a standard court.
          example: Temporary Courtroom at Town Hall
          maxLength: 200
          minLength: 1
          type: string
        cjaCode:
          description: Criminal Justice Area code.
          example: CJ
          maxLength: 2
