method: derived
status: candidate
source: Derived from operationIds in openapi/ (Applications Register, Crime Hearing Results Document Subscription, Results
  Validation Service). Core Case Data specs (Swagger 2.0) carry no operationIds and were not mapped.
deployment:
  mode: none
  auth: unknown
  verified: derived
description: 'No HMCTS-published MCP server fronts these APIs. Searched 2026-10-09: GitHub org search "mcp org:hmcts" returned
  5 repos, all developer tooling unrelated to these REST APIs (see related_provider_mcp_repos); probed https://hmcts.github.io/.well-known/mcp.json
  -> 404. The tool list below is a CANDIDATE derived 1:1 from real operationIds.'
related_provider_mcp_repos:
- repo: https://github.com/hmcts/crime-frontend-developer-mcp
  note: Self-hosted SSE MCP server (status beta, v0.1.0-beta.0) exposing 18 tools over the Crime Platform Design Kit source
    (e.g. pdk_list_components, pdk_get_component, gate_intake). Runs locally (http://127.0.0.1:3000/sse) per README; no public
    hosted endpoint. Not backed by the OpenAPI operations here.
- repo: https://github.com/hmcts/ai-in-sdlc-smart-prompts-mcp
  note: Fork of prompts-mcp-server for prompt management (7 tools); developer tooling.
- repo: https://github.com/hmcts/ai-in-sdlc-mcp-proxy
  note: Proxy to run STDIO MCP services remotely.
- repo: https://github.com/hmcts/crime-mcp-register
  note: Runtime plumbing (SSE transport, OAuth proxy) for HMCTS Crime MCP servers.
- repo: https://github.com/hmcts/cp-agentic-access
  note: 'Design repo: "AI-agent access to the Common Platform: WebMCP, remote MCP via the API Marketplace". Design intent
    only; README is one line, no endpoint published.'
