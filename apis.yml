aid: hmcts

name: HM Courts & Tribunals Service

description: HM Courts & Tribunals Service (HMCTS) is the executive agency of the UK Ministry of Justice responsible for administering the criminal,
  civil and family courts in England and Wales and the reserved unified tribunals across the United Kingdom. Its engineering teams publish open
  source code on GitHub (github.com/hmcts) and the "HMCTS way" engineering standards at hmcts.github.io, including Spectral API linting rulesets
  used in its API repositories.

